name: Update portfolio prices

# Runs automatically at 22:45 UTC, Monday-Friday.
# That's ~5:45pm New York (after the US close) and ~4:15am IST —
# so one run captures the same day's US close AND India's close.
# You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance requests curl_cffi

      - name: Refresh prices and rewrite index.html
        run: python update_prices.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore: nightly portfolio refresh" && git push)
